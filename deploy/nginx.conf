# D_MAK MUSIC — reverse proxy sample (TLS termination + caching).
# Replace dmakmusic.com and the certificate paths with your own.

server {
  listen 80;
  server_name dmakmusic.com www.dmakmusic.com;
  return 301 https://dmakmusic.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name dmakmusic.com www.dmakmusic.com;

  ssl_certificate     /etc/letsencrypt/live/dmakmusic.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dmakmusic.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml;

  # Fingerprint-free but long-lived static assets
  location ~* ^/(fonts|img)/ {
    proxy_pass http://127.0.0.1:3000;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  client_max_body_size 2m;
}
